<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSR71" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12" />
      <stop offset="100%" stop-color="#0d1522" />
    </linearGradient>
    <linearGradient id="bodySR71" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#242c38" />
      <stop offset="100%" stop-color="#111620" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="600" height="350" fill="url(#bgSR71)" />
  <!-- Grid lines -->
  <path d="M0 50 H600 M0 100 H600 M0 150 H600 M0 200 H600 M0 250 H600 M0 300 H600" stroke="#152132" stroke-width="1" stroke-dasharray="4 4" />
  <path d="M100 0 V350 M200 0 V350 M300 0 V350 M400 0 V350 M500 0 V350" stroke="#152132" stroke-width="1" stroke-dasharray="4 4" />

  <!-- SR-71 Blackbird Silhouette (Top View) -->
  <g transform="translate(300, 160) scale(0.95)">
    <!-- Fuselage with Chines and Wings -->
    <path d="M 0,-135
             C 4,-100 8,-40 18,-15
             L 50,-10
             L 50,75
             L 80,75
             L 82,90
             L 16,86
             L 0,92
             L -16,86
             L -82,90
             L -80,75
             L -50,75
             L -50,-10
             L -18,-15
             C -8,-40 -4,-100 0,-135 Z"
          fill="url(#bodySR71)" stroke="#526071" stroke-width="2" />
    <!-- Center Fuselage Spine -->
    <ellipse cx="0" cy="-20" rx="9" ry="105" fill="#18202c" stroke="#3b4859" stroke-width="1.2" />
    <!-- Tandem Cockpits -->
    <ellipse cx="0" cy="-75" rx="3.5" ry="11" fill="#0b0f17" stroke="#38bdf8" stroke-width="1.2" />
    <ellipse cx="0" cy="-52" rx="3.5" ry="9" fill="#0b0f17" stroke="#38bdf8" stroke-width="1.2" />
    <!-- Left Engine Nacelle & Inlet Spike -->
    <g transform="translate(-48, 20)">
      <polygon points="0,-60 -5,-35 5,-35" fill="#475569" />
      <rect x="-9" y="-35" width="18" height="70" rx="6" fill="#1e2633" stroke="#64748b" stroke-width="1.5" />
      <ellipse cx="0" cy="35" rx="7" ry="3.5" fill="#ef4444" stroke="#f87171" stroke-width="1" />
      <!-- Inward canted rudder line -->
      <line x1="0" y1="5" x2="3" y2="35" stroke="#94a3b8" stroke-width="1.5" />
    </g>
    <!-- Right Engine Nacelle & Inlet Spike -->
    <g transform="translate(48, 20)">
      <polygon points="0,-60 -5,-35 5,-35" fill="#475569" />
      <rect x="-9" y="-35" width="18" height="70" rx="6" fill="#1e2633" stroke="#64748b" stroke-width="1.5" />
      <ellipse cx="0" cy="35" rx="7" ry="3.5" fill="#ef4444" stroke="#f87171" stroke-width="1" />
      <!-- Inward canted rudder line -->
      <line x1="0" y1="5" x2="-3" y2="35" stroke="#94a3b8" stroke-width="1.5" />
    </g>
  </g>

  <!-- Aircraft Label Overlay -->
  <rect x="20" y="285" width="230" height="42" rx="4" fill="#060d17" fill-opacity="0.85" stroke="#2c3e55" stroke-width="1" />
  <text x="32" y="304" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">SR-71 BLACKBIRD</text>
  <text x="32" y="320" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Mach 3+ Strategic Reconnaissance</text>
</svg>
