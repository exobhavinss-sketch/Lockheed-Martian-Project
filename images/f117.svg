<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgF117" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c14" />
      <stop offset="100%" stop-color="#111a28" />
    </linearGradient>
    <linearGradient id="stealthF117" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="600" height="350" fill="url(#bgF117)" />
  <!-- Grid lines -->
  <path d="M0 50 H600 M0 100 H600 M0 150 H600 M0 200 H600 M0 250 H600 M0 300 H600" stroke="#182333" stroke-width="1" stroke-dasharray="4 4" />
  <path d="M100 0 V350 M200 0 V350 M300 0 V350 M400 0 V350 M500 0 V350" stroke="#182333" stroke-width="1" stroke-dasharray="4 4" />

  <!-- F-117 Nighthawk Faceted Stealth Silhouette (Top View) -->
  <g transform="translate(300, 160) scale(1.05)">
    <!-- Main Faceted Diamond Body and Wings -->
    <path d="M 0,-115
             L 100,20
             L 78,55
             L 28,38
             L 34,75
             L 22,78
             L 12,48
             L 0,60
             L -12,48
             L -22,78
             L -34,75
             L -28,38
             L -78,55
             L -100,20 Z"
          fill="url(#stealthF117)" stroke="#64748b" stroke-width="2" />
    <!-- Facet Character Lines -->
    <line x1="0" y1="-115" x2="0" y2="40" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="0" y1="-115" x2="28" y2="38" stroke="#475569" stroke-width="1.2" />
    <line x1="0" y1="-115" x2="-28" y2="38" stroke="#475569" stroke-width="1.2" />
    <line x1="0" y1="-45" x2="100" y2="20" stroke="#475569" stroke-width="1" />
    <line x1="0" y1="-45" x2="-100" y2="20" stroke="#475569" stroke-width="1" />
    <!-- Triangular Faceted Cockpit Canopy -->
    <polygon points="0,-75 7,-45 -7,-45" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Low Observable Exhaust Slots -->
    <rect x="-18" y="44" width="12" height="4" rx="1" fill="#475569" />
    <rect x="6" y="44" width="12" height="4" rx="1" fill="#475569" />
  </g>

  <!-- Aircraft Label Overlay -->
  <rect x="20" y="285" width="230" height="42" rx="4" fill="#060d17" fill-opacity="0.85" stroke="#2c3e55" stroke-width="1" />
  <text x="32" y="304" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">F-117 NIGHTHAWK</text>
  <text x="32" y="320" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">First Operational Stealth Aircraft</text>
</svg>
