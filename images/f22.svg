<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgF22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111e" />
      <stop offset="100%" stop-color="#14213d" />
    </linearGradient>
    <linearGradient id="jetF22" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="600" height="350" fill="url(#bgF22)" />
  <!-- Grid lines -->
  <path d="M0 50 H600 M0 100 H600 M0 150 H600 M0 200 H600 M0 250 H600 M0 300 H600" stroke="#1f2d42" stroke-width="1" stroke-dasharray="4 4" />
  <path d="M100 0 V350 M200 0 V350 M300 0 V350 M400 0 V350 M500 0 V350" stroke="#1f2d42" stroke-width="1" stroke-dasharray="4 4" />

  <!-- F-22 Raptor Silhouette / Graphic (Diamond Wing Top View) -->
  <g transform="translate(300, 160) scale(1.05)">
    <!-- Main Body & Diamond Wings -->
    <path d="M 0,-110 
             L 16,-40 
             L 92,10 
             L 86,40 
             L 25,24 
             L 38,78 
             L 15,82 
             L 8,62 
             L 0,65 
             L -8,62 
             L -15,82 
             L -38,78 
             L -25,24 
             L -86,40 
             L -92,10 
             L -16,-40 Z" 
          fill="url(#jetF22)" stroke="#e5e7eb" stroke-width="2" />
    <!-- Cockpit Canopy -->
    <ellipse cx="0" cy="-40" rx="5" ry="20" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Twin Engine Exhausts -->
    <rect x="-10" y="65" width="7" height="12" rx="1.5" fill="#ef4444" />
    <rect x="3" y="65" width="7" height="12" rx="1.5" fill="#ef4444" />
    <!-- Wing Chime Lines -->
    <line x1="-16" y1="-40" x2="-80" y2="14" stroke="#374151" stroke-width="1.5" />
    <line x1="16" y1="-40" x2="80" y2="14" stroke="#374151" stroke-width="1.5" />
  </g>

  <!-- Aircraft Label Overlay -->
  <rect x="20" y="285" width="220" height="42" rx="4" fill="#060d17" fill-opacity="0.85" stroke="#2c3e55" stroke-width="1" />
  <text x="32" y="304" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">F-22 RAPTOR</text>
  <text x="32" y="320" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Air Superiority Stealth Fighter</text>
</svg>
