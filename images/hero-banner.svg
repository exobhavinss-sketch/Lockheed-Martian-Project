<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#112240" />
      <stop offset="60%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </radialGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020c1b" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#skyGrad)" />

  <!-- Aerospace Compass / Radar Ring -->
  <circle cx="600" cy="250" r="180" fill="none" stroke="#203a63" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />
  <circle cx="600" cy="250" r="120" fill="none" stroke="#203a63" stroke-width="1" opacity="0.4" />
  <circle cx="600" cy="250" r="60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
  <line x1="380" y1="250" x2="820" y2="250" stroke="#203a63" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />
  <line x1="600" y1="50" x2="600" y2="450" stroke="#203a63" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Subtle Jet Formation Silhouette in background -->
  <g opacity="0.25" fill="#64748b" transform="translate(600, 190) scale(0.6)">
    <polygon points="0,-80 50,40 20,30 0,50 -20,30 -50,40" />
  </g>
  <g opacity="0.18" fill="#64748b" transform="translate(480, 230) scale(0.4)">
    <polygon points="0,-80 50,40 20,30 0,50 -20,30 -50,40" />
  </g>
  <g opacity="0.18" fill="#64748b" transform="translate(720, 230) scale(0.4)">
    <polygon points="0,-80 50,40 20,30 0,50 -20,30 -50,40" />
  </g>

  <!-- Ground Grid Perspective -->
  <rect y="380" width="1200" height="120" fill="url(#gridGrad)" />
</svg>
